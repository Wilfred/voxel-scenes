<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxel Scenes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wallpaper">
      <header>
        <h1>Voxel Scenes</h1>
        <span id="seed"></span><a href="./assets.html">Asset library</a>
        <button
          id="hide-controls"
          aria-label="Hide controls"
          title="Hide controls for a minute. Press Space to toggle controls."
        >
          ×
        </button>
        <div class="scene-controls">
          <label
            >Scene
            <select id="scene">
              <option value="island">Crescent bay</option>
              <option value="woods">Woodland stream</option>
              <option value="millpond">Orchard millpond</option>
              <option value="hillside">Hillside falls</option>
            </select></label
          >
          <label
            >Weather
            <select id="weather">
              <option value="clear">Clear daylight</option>
              <option value="sunrise">Sunrise</option>
              <option value="morning">Morning sun</option>
              <option value="evening">Evening light</option>
              <option value="sunset">Sunset</option>
              <option value="overcast">Bright overcast</option>
              <option value="clearing">Clearing rain</option>
            </select></label
          >
          <button id="generate">New island</button>
        </div>
      </header>
      <canvas
        tabindex="0"
        title="Drag or use the arrow keys to rotate. Scroll to zoom. Double-click or press Home to reset."
        role="img"
        aria-label="A crescent bay with a wooded ridge and a cottage above the beach"
      ></canvas>
      <div class="toolbox">
        <div class="controls">
          <label
            >Framing
            <select id="framing">
              <option value="vista">Vista</option>
              <option value="model">Rectangular model</option>
            </select></label
          >
          <div class="zoom" role="group" aria-label="Camera zoom">
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <output id="zoom-value" aria-label="Zoom level">100%</output>
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
          </div>
          <button id="reset-camera">Reset camera</button>
          <label
            >Grid resolution <input id="resolution" type="range" min="0.75" max="5" step="0.25" value="1" />
            <output id="grid-value" for="resolution">1×</output></label
          >
          <button id="save">Save PNG</button>
        </div>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
