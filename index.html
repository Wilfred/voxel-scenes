<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voxel Scenes</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <main>
      <header><h1>Voxel Scenes</h1><span id="seed"></span></header>
      <canvas role="img" aria-label="A crescent bay with a wooded ridge and a cottage above the beach"></canvas>
      <div class="controls">
        <label>Scene <select id="scene">
          <option value="island">Crescent bay</option>
          <option value="woods">Woodland stream</option>
          <option value="hillside">Hillside falls</option>
        </select></label>
        <label>Framing <select id="framing">
          <option value="vista">Vista</option>
          <option value="model">Rectangular model</option>
        </select></label>
        <label>Grid resolution <input id="resolution" type="range" min="1" max="10" step="0.25" value="1">
          <output id="grid-value" for="resolution">1×</output></label>
        <button id="generate">New island</button>
        <button id="save">Save PNG</button>
      </div>
      <details id="design-gallery">
        <summary>Design studies</summary>
        <label>Model <select id="family"><option value="cottage">Cottage</option><option value="pine">Pine</option><option value="broadleaf">Broadleaf</option></select></label>
        <p>Choose a design to use in the landscape.</p>
        <div id="studies"></div>
      </details>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
